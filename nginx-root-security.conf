# Prefer setting the server root to this package's public directory.
# Use these guards only when a host forces the project root to be web-accessible.

location ~ ^/(config|storage|system|tests|scripts|content/plugins|content/themes)(/|$) {
    deny all;
}

location ~* ^/content/uploads/.*\.(php|phtml|phar|cgi|pl|py|rb|sh|js|html?|svg)$ {
    return 403;
}

location ~* /(\.env.*|composer\.(json|lock)|CMS_RELEASE_.*\.md|CMS_COMPLETION_STATUS_AUDIT.*\.md|.*\.(zip(\.sha256)?|manifest\.json|sql|sqlite|db|bak|backup|old|orig|pem|key|crt|csr))$ {
    deny all;
}

location / {
    try_files /public$uri /public$uri/ /public/index.php?$query_string;
}
